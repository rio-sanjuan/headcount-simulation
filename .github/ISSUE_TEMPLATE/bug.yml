name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. Please use synthetic values only, and never include real company,
        workforce, or compensation data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and its output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and hcsim commit or version.
    validations:
      required: true
