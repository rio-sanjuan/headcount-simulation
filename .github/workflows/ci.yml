# Checks code only: nothing is deployed or executed remotely. Every step calls a make target.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: select tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - id: select
        env:
          # Empty on pushes to main, which runs everything.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "tests=$(make -s affected BASE="$BASE")" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make typecheck

  arch:
    name: layer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make arch

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # With a token, zizmor also runs its online audits, such as known-vulnerable actions.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: make workflows

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make deps

  test:
    name: test (python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            coverage: true
          - python: "3.14"
            coverage: false
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Replays every failing example Hypothesis has found until it's fixed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ matrix.python }}-
      - if: ${{ !matrix.coverage }}
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: make test TESTS="$TESTS"
      - if: ${{ matrix.coverage }}
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: make test-cov TESTS="$TESTS"
      # Hypothesis' example database holds the failing inputs. The upload is scanned first.
      - if: failure()
        # The newer `$/` form is safer, but actionlint 1.7.12 can't parse it yet. Nothing is cloned
        # at runtime before this step, so `./` loads only this repository's action.
        uses: ./.github/actions/scan-and-upload # zizmor: ignore[self-repository]
        with:
          name: hypothesis-${{ matrix.python }}
          path: .hypothesis
          denylist: ${{ secrets.SANITIZE_DENYLIST }}
      # At least 90% of the lines a PR changes must be tested, and 95% in hcsim.financial.
      - if: ${{ matrix.coverage && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make diff-coverage

  memory:
    name: peak memory
    needs: changes
    if: needs.changes.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: make memory TESTS="$TESTS"

  sanitize:
    name: sanitization scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # A missing secret fails the scan (exit 2) rather than passing it.
      - if: github.event_name == 'pull_request'
        env:
          SANITIZE_DENYLIST: ${{ secrets.SANITIZE_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: make sanitize-pr
      - if: github.event_name == 'push'
        env:
          SANITIZE_DENYLIST: ${{ secrets.SANITIZE_DENYLIST }}
          BEFORE: ${{ github.event.before }}
        run: make sanitize-main

  secrets:
    name: credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make secrets

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            build
            ci
            test
            refactor
            perf
            chore
            revert

  # The only required check. It fails if any job above failed or was cancelled, so renaming a
  # job or a matrix entry never breaks branch protection, and skipped jobs need no handling.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [changes, lint, typecheck, arch, workflows, deps, test, memory, sanitize, secrets, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
