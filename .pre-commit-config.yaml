# Install with: uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Matches the uv version the lockfile was written with. Update both together.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  # The sanitization scan. The denylist is private: see tools/sanitize_scan.py for where it's read.
  - repo: local
    hooks:
      - id: sanitize-files
        name: sanitization scan (staged files)
        entry: uv run --frozen --quiet python tools/sanitize_scan.py
        language: system
        stages: [pre-commit]
      - id: sanitize-commit-msg
        name: sanitization scan (commit message)
        entry: uv run --frozen --quiet python tools/sanitize_scan.py --commit-msg
        language: system
        stages: [commit-msg]
      - id: sanitize-push
        name: sanitization scan (what this push sends)
        entry: uv run --frozen --quiet python tools/sanitize_scan.py --pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
