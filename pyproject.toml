[project]
name = "hcsim"
version = "0.1.0.dev0"
description = "Employee-level Monte Carlo headcount forecast, aggregate guidance forecasting, and stock-based compensation (ASC 718) expense simulation on fully synthetic data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "numpy>=2.2",
    # statsforecast requires pandas below 3.0, so the whole project stays on pandas 2.x.
    "pandas>=2.2,<3",
    "pydantic>=2.13",
    "pyyaml>=6.0.2",
]

[project.scripts]
hcsim = "hcsim.cli:main"

[project.optional-dependencies]
darts = ["darts>=0.36"]
darts-deep = ["darts[torch]>=0.36"]
sktime = ["sktime>=0.38"]
prophet = ["prophet>=1.1.6"]
docs = ["mkdocs-material>=9.6"]
# The `app` extra arrives with the explorer in M9, once its stack is chosen.

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "diff-cover>=10.6.0",
    "hypothesis>=6.170.5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pandas-stubs>=2.2,<3",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-memray>=1.11.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260724",
    "zizmor>=1.31.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PT",           # pytest style
    "NPY",          # NumPy
    "C4",           # comprehensions
]
# En dashes mark ranges in prose and issue titles, such as "M0–M9".
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["hcsim", "tests", "tools"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true

# The Model and Financial layers carry the contracts and the accounting, so they're strict.
# The flags are listed one by one: `strict = true` in an override applies to every module.
[[tool.mypy.overrides]]
module = ["hcsim.model.*", "hcsim.financial.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
warn_return_any = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: long-running tests, run in the heavy CI jobs",
    "acceptance: statistical checks over many trajectories",
    "e2e: end-to-end runs through every layer",
]

# Layer contracts from section 3.2 of the plan. The study-module contracts ("no study imports
# another", "studies.inputs imports nothing from studies.catalog") arrive with those modules in M8.
[tool.importlinter]
root_package = "hcsim"

[[tool.importlinter.contracts]]
name = "The Model Layer is the leaf"
type = "forbidden"
source_modules = ["hcsim.model"]
forbidden_modules = [
    "hcsim.guidance", "hcsim.financial", "hcsim.engine", "hcsim.studies", "hcsim.synth",
    "hcsim.bench",
]

[[tool.importlinter.contracts]]
name = "The Financial Layer reads only the Model Layer's contract surface"
type = "forbidden"
source_modules = ["hcsim.financial"]
forbidden_modules = [
    "hcsim.model.ml", "hcsim.model.domains", "hcsim.model.data", "hcsim.model.sql",
    "hcsim.guidance", "hcsim.engine", "hcsim.studies", "hcsim.synth", "hcsim.bench",
]

[[tool.importlinter.contracts]]
name = "The guidance pipeline depends only on the Model Layer"
type = "forbidden"
source_modules = ["hcsim.guidance"]
forbidden_modules = ["hcsim.financial", "hcsim.engine", "hcsim.studies", "hcsim.synth", "hcsim.bench"]

[[tool.importlinter.contracts]]
name = "The engine depends only on the Model and Financial layers"
type = "forbidden"
source_modules = ["hcsim.engine"]
forbidden_modules = ["hcsim.guidance", "hcsim.studies", "hcsim.synth", "hcsim.bench"]

[[tool.importlinter.contracts]]
name = "The synthetic world shares no code with the rest of hcsim"
type = "forbidden"
source_modules = ["hcsim.synth"]
forbidden_modules = [
    "hcsim.model", "hcsim.guidance", "hcsim.financial", "hcsim.engine", "hcsim.studies",
    "hcsim.bench",
]

# Studies read the synthetic world through its data, never its code. Only the scale harness
# imports it, to generate large worlds for benchmarks.
[[tool.importlinter.contracts]]
name = "Nothing but the scale harness imports the synthetic world"
type = "forbidden"
source_modules = [
    "hcsim.model", "hcsim.guidance", "hcsim.financial", "hcsim.engine", "hcsim.studies",
]
forbidden_modules = ["hcsim.synth"]

[[tool.importlinter.contracts]]
name = "Nothing imports the scale harness"
type = "forbidden"
source_modules = [
    "hcsim.model", "hcsim.guidance", "hcsim.financial", "hcsim.engine", "hcsim.studies",
    "hcsim.synth",
]
forbidden_modules = ["hcsim.bench"]

[tool.coverage.run]
source = ["hcsim", "tools"]
branch = true
# CLI tests run tools as subprocesses, and coverage follows them.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
